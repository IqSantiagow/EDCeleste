[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edceleste"
version = "0.1.0"
description = "LLM-powered terminal-like copilot for Elite Dangerous"
requires-python = ">=3.12"
dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.3",
    "aiosignal==1.4.0",
    "annotated-types==0.7.0",
    "anthropic==0.111.0",
    "anyio==4.14.0",
    "attrs==25.4.0",
    "certifi==2026.6.17",
    "claude-agent-sdk==0.2.144",
    "dependency-injector==4.49.1",
    "distro==1.9.0",
    "docstring_parser==0.18.0",
    "frozenlist==1.8.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "jiter==0.15.0",
    "linkify-it-py==2.1.0",
    "lxml==6.1.1",
    "markdown-it-py==4.0.0",
    "mdit-py-plugins==0.5.0",
    "mdurl==0.1.2",
    "multidict==6.7.1",
    "openrouter==0.7.11",
    "platformdirs==4.9.4",
    "propcache==0.4.1",
    "pydantic-settings==2.11.0",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "Pygments==2.19.2",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "rich==14.3.3",
    "sniffio==1.3.1",
    "textual==8.1.1",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "uc-micro-py==2.0.0",
    "yarl==1.23.0",
    "pydirectinput-rgx==2.1.3",
    "edge-tts==7.2.8",
    "soundfile==0.14.0",
    "sounddevice==0.5.5",
    "openai-whisper==20250625",
    "chatterbox-tts==0.1.7",
    "textual-slider==0.2.0",
]

[project.optional-dependencies]
test = [
    "coverage==7.14.2",
    "mock==5.2.0",
]
dev = [
    "aiohttp-jinja2==1.6",
    "ast_serialize==0.5.0",
    "click==8.3.1",
    "colorama==0.4.6",
    "Jinja2==3.1.6",
    "librt==0.11.0",
    "MarkupSafe==3.0.3",
    "msgpack==1.1.2",
    "mypy==2.1.0",
    "mypy_extensions==1.1.0",
    "pathspec==1.1.1",
    "ruff==0.15.18",
    "textual-dev==1.8.0",
    "textual-serve==1.1.3",
]

[project.scripts]
edceleste = "edceleste.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edceleste = ["ui/*.tcss"]

[tool.ruff.lint]
select = ["E", "F", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tkinter".msg = "Nie używaj tkinter w tym projekcie."
"rich".msg = "Nie importuj rich bezpośrednio; używaj Textual/CSS."

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
omit = [
    "*/tests/*",
    "test_*",
    "*/edceleste/__main__.py",
    "*/projection/exceptions/*",
    "*/ui/*",
]
skip_empty = true