[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edceleste"
version = "0.1.0"
description = "LLM-powered terminal-like copilot for Elite Dangerous"
requires-python = ">=3.12"
dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp-jinja2==1.6",
    "aiohttp==3.13.3",
    "aiosignal==1.4.0",
    "annotated-types==0.7.0",
    "anthropic==0.111.0",
    "anyio==4.14.0",
    "ast_serialize==0.5.0",
    "attrs==25.4.0",
    "certifi==2026.6.17",
    "charset-normalizer==3.4.7",
    "click==8.3.1",
    "colorama==0.4.6",
    "coverage==7.14.2",
    "dependency-injector==4.49.1",
    "distro==1.9.0",
    "docstring_parser==0.18.0",
    "frozenlist==1.8.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "Jinja2==3.1.6",
    "jiter==0.15.0",
    "jsonpatch==1.33",
    "jsonpointer==3.1.1",
    "langchain-anthropic==1.4.6",
    "langchain-core==1.4.8",
    "langchain-openrouter==0.1.0",
    "langchain-protocol==0.0.18",
    "langchain==1.3.11",
    "langgraph-checkpoint==4.1.1",
    "langgraph-prebuilt==1.1.0",
    "langgraph-sdk==0.4.2",
    "langgraph==1.2.7",
    "langsmith==0.8.18",
    "librt==0.11.0",
    "linkify-it-py==2.1.0",
    "lxml==6.1.1",
    "markdown-it-py==4.0.0",
    "MarkupSafe==3.0.3",
    "mdit-py-plugins==0.5.0",
    "mdurl==0.1.2",
    "mock==5.2.0",
    "msgpack==1.1.2",
    "multidict==6.7.1",
    "mypy==2.1.0",
    "mypy_extensions==1.1.0",
    "openrouter==0.7.11",
    "orjson==3.11.9",
    "ormsgpack==1.12.2",
    "packaging==26.2",
    "pathspec==1.1.1",
    "platformdirs==4.9.4",
    "propcache==0.4.1",
    "pydantic-settings==2.11.0",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "Pygments==2.19.2",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "requests-toolbelt==1.0.0",
    "requests==2.34.2",
    "rich==14.3.3",
    "ruff==0.15.18",
    "sniffio==1.3.1",
    "tenacity==9.1.4",
    "textual-dev==1.8.0",
    "textual-serve==1.1.3",
    "textual==8.1.1",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "uc-micro-py==2.0.0",
    "urllib3==2.7.0",
    "uuid_utils==0.16.2",
    "websockets==15.0.1",
    "xxhash==3.7.0",
    "yarl==1.23.0",
    "zstandard==0.25.0",
    "pydirectinput-rgx==2.1.3",
]

[tool.setuptools]
packages = []

[tool.ruff.lint]
select = ["E", "F", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tkinter".msg = "Nie używaj tkinter w tym projekcie."
"rich".msg = "Nie importuj rich bezpośrednio; używaj Textual/CSS."

[tool.coverage.run]
source = ["."]

[tool.coverage.report]
omit = ["*/tests/*", "test_*", "/app.py", "*/projection/exceptions/*", "*/ui/*"]
skip_empty = true