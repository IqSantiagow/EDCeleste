stt:
  enabled: true
  model: "tiny.en"
  hotkey: null
game_actions:
  enabled: false
event_reactions:
  reactions:
    ApproachBody: false
    ApproachSettlement: false
    Commander: false
    Died: false
    Docked: false
    DockingGranted: false
    FSDJump: false
    FuelScoop: false
    LeaveBody: false
    LoadGame: true
    Location: false
    Promotion: false
    Rank: false
    RefuelAll: false
    Reputation: false
    ReservoirReplenished: false
    Resurrect: false
    StartJump: false
    SupercruiseDestinationDrop: false
    SupercruiseEntry: false
    SupercruiseExit: false
    Undocked: false
paths:
  journal_path: "C:\\Users\\YourUsername\\Saved Games\\Frontier Developments\\Elite Dangerous"
  keybindings_path: "C:\\Users\\YourUsername\\AppData\\Local\\Frontier Developments\\Elite Dangerous\\Options\\Bindings"

tts:
  provider: "edge"
  params:
    voice: "en-GB-SoniaNeural"
  # Chatterbox clones a voice from the reference profile stored in the voices directory.
  # The nano model is faster, but it ignores exaggeration and cfg_weight.
  # provider: "chatterbox"
  # params:
  #   profile: "celeste-v3"
  #   exaggeration: 0.7
  #   cfg_weight: 0.5
  #   device: "auto"
  #   nano: true
  # Pocket TTS clones a voice from a profile too, but runs on the processor only and takes no
  # graphics card memory. Its profiles are kept apart from the Chatterbox ones. Clone from a clean,
  # dry recording: the voice copies the echo and hiss of the clip.
  # provider: "pocket"
  # params:
  #   profile: "celeste-v3"
  volume: 1.0
  # The ship effect makes Celeste sound like the ship computer of the game, with every engine.
  # It is one fixed effect: nothing to set except on or off.
  ship_effect: true

llm:
  provider:
    type: "openrouter"
    model: "anthropic/claude-haiku-4.5"
    api_key: ""
    # Leave empty for the default endpoint of the provider. Needed by the ones
    # that have no public endpoint, for example a local ollama or vllm server.
    base_url: ""
  # Instinct presses keys for simple commands before Celeste answers. Its model
  # (1.5 GB) is downloaded from Hugging Face the first time it is switched on.
  instinct:
    enabled: false
    device: "auto"  # auto, cuda or cpu
  system_prompt: "You are a helpful assistant for Elite Dangerous."
  user_prompt: "Summarize the current game state."