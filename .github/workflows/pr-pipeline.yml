name: PR pipeline

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

on:
  pull_request:
    branches:
      - main
    types: [ opened, synchronize, ready_for_review, reopened ]
  # After a merge, lint and tests run again on main and the report job publishes the test history
  push:
    branches:
      - main
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]

jobs:
  lint:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.18

      - name: Lint code
        run: ruff check --output-format=github

      - name: Format check
        run: ruff format --diff

  test:
    needs: lint
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pr-action
    steps:
      - uses: actions/checkout@v7

      - name: Setup python version
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
          cache: pip

      - name: Install system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Type check
        run: mypy

      - name: Run tests and coverage
        run: |
          coverage run -m pytest --alluredir allure-results
          coverage report -m
          coverage xml

      # A failing run still has results, and the report job needs them most then
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Generate coverage report
        if: github.event_name == 'pull_request'
        uses: orgoro/coverage@v3.3
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}

  report:
    needs: test
    # Only main writes the test history: a PR's code may never land.
    # When lint failed the tests were skipped, so there are no results to report.
    if: always() && github.event_name == 'push' && (needs.test.result == 'success' || needs.test.result == 'failure')
    runs-on: ubuntu-latest
    # Write access only here, not in test, which installs 60+ dependencies
    permissions:
      contents: write
    # Two merges close together publish one after the other, so neither loses its history line
    concurrency:
      group: allure-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Check out the published report
        # The gh-pages branch does not exist before the first run
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure report
        # allurerc.json writes the report and the history to allure-report/
        run: |
          mkdir -p allure-report
          if [ -f gh-pages/history.jsonl ]; then
            cp gh-pages/history.jsonl allure-report/history.jsonl
          fi
          npx --yes allure@3.20.1 generate allure-results

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          # One commit with only the latest report, so the branch stays small
          force_orphan: true

  mutation:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MIN_MUTATION_SCORE: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find changed source files
        id: changed
        run: |
          changed_files=$(git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" -- 'src/edceleste/*.py' \
            | grep -v -e '^src/edceleste/ui/' -e '^src/edceleste/__main__.py$' || true)
          echo "files=$(echo $changed_files)" >> "$GITHUB_OUTPUT"
          echo "Changed source files: $changed_files"
          if [ -z "$changed_files" ]; then
            echo "Mutation tests skipped: this PR changes no source files outside ui/." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup python version
        if: steps.changed.outputs.files != ''
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
          cache: pip

      - name: Install system audio dependencies
        if: steps.changed.outputs.files != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 ffmpeg

      - name: Install dependencies
        if: steps.changed.outputs.files != ''
        # Only the dependencies: an installed edceleste could shadow the mutated code.
        # The CPU build of torch is a few GB smaller and the tests do not need a GPU.
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu ".[test,mutation]"
          pip uninstall -y edceleste

      - name: Run mutation tests
        if: steps.changed.outputs.files != ''
        env:
          # File names come from the PR, so they go through env and not straight into the script
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: bash mutation_testing/run_mutmut.sh $CHANGED_FILES

      - name: Write job summary
        if: always() && steps.changed.outputs.files != ''
        run: |
          {
            echo "## Mutation tests"
            echo "Required score: ${MIN_MUTATION_SCORE}%"
            echo '```'
            cat mutation_testing/report/summary.txt 2>/dev/null || echo "No report, the run stopped before mutmut finished. See the job log."
            echo '```'
            if [ -s mutation_testing/report/survivors.txt ]; then
              echo "<details><summary>Mutants no test caught</summary>"
              echo
              echo '```diff'
              head -c 60000 mutation_testing/report/survivors.txt
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation report
        if: always() && steps.changed.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation_testing/report/

  claude-review:
    needs: [ lint, test ]
    runs-on: ubuntu-latest
    environment: pr-action
    # Run after lint/test succeed (or were skipped for non-PR-open events), on PR events,
    # or on PR comments/review comments only when @claude is mentioned.
    # Issue-only triage lives in issue-triage.yml, not here.
    if: |
      always() &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      )
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CC_OAUTH_TOKEN }}
          track_progress: true
          allowed_bots: "dependabot[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a senior code reviewer. Review ONLY the changes introduced in this pull request diff.

            ## Scope rules (CRITICAL)
            - Review EXCLUSIVELY the lines added or modified in this PR diff.
            - Do NOT flag issues in unchanged code, even if you spot problems there.
            - Do NOT expand the review scope beyond the PR's intent.
            - If the PR fixes a previous review — verify ONLY that the requested fixes were applied. Do not hunt for new issues in surrounding code.
            - When all changes look correct, say so clearly and approve.
            ## What to review
            1. Bugs or logical errors in the changed code
            2. Security vulnerabilities introduced by the changes
            3. Significant performance regressions
            4. Violations of existing code patterns/conventions visible in the diff context

            ## What to IGNORE
            - Style nitpicks (formatting, naming preferences) unless they break consistency
            - Missing features unrelated to the PR's goal
            - Pre-existing issues in unchanged code
            - Hypothetical edge cases with no realistic trigger
            ## Response format

            ### Summary
            One paragraph: what this PR does, whether the changes are correct, and the merge verdict (approve / request changes).

            ### Issues (only if found)
            For each real issue:
            - **File:line** — severity (bug | security | performance)
            - Description of the problem
            - Suggested fix (code snippet if helpful)

            If no issues found, write: "No issues found. Ready to merge."

            ### Maintenance notes (optional)
            Non-critical observations that could go into a weekly maintenance ticket. Keep to max 2-3 bullet points. Skip this section entirely if nothing worth noting

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
